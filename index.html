<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>Defenda a Vila — Live Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#05060f;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#18204a 0,#090b1b 42%,#05060f 100%)}
    #stage{position:relative;width:min(100vw,calc(100vh * 9 / 16));height:min(100vh,calc(100vw * 16 / 9));max-height:100vh;overflow:hidden;background:#090b1b}
    canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    #toolbar{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:8px}
    .icon-btn{height:44px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:0 14px;background:rgba(7,8,18,.78);backdrop-filter:blur(12px);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.24)}
    #statusDot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#f87171;box-shadow:0 0 12px currentColor}

    #panel{position:absolute;z-index:10;right:12px;bottom:12px;width:min(340px,calc(100% - 24px));max-height:min(620px,calc(100% - 80px));overflow:auto;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px;background:rgba(7,8,18,.94);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.48);transition:.22s ease}
    #panel.closed{transform:translateY(calc(100% + 24px));opacity:0;pointer-events:none}
    #panel h2{margin:0 0 4px;font:24px "Bungee",sans-serif;color:#ffd166}#panel p{margin:6px 0 12px;color:#b9bfd2;font-size:13px;line-height:1.45}
    label{display:block;margin:11px 0 6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#dfe4f3}
    input{width:100%;height:44px;border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:0 12px;background:#111326;color:#fff;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.12)}
    .row{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.ghost{height:44px;border-radius:10px;border:0;padding:0 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#ff7a00,#ffb020);color:#181005}.ghost{background:#24283d;color:#fff}
    #testGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.test{height:38px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:#171a2d;color:#fff;font-weight:850;cursor:pointer}.test:hover{background:#252942}
    #log{margin-top:10px;height:92px;overflow:auto;border-radius:10px;padding:8px;background:#090b18;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aeb5cc}.log-item{border-bottom:1px solid rgba(255,255,255,.06)}
    #connectionWarning{display:none;margin-top:10px;border:1px solid rgba(248,113,113,.35);border-radius:10px;padding:9px;background:rgba(248,113,113,.08);color:#fecaca;font-size:12px}
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="toolbar"><button class="icon-btn" id="panelBtn"><span id="statusDot"></span><span id="statusText">Conectar</span></button></div>
    <aside id="panel">
      <h2>TikFinity</h2>
      <p>Conecte o servidor WebSocket da sua live. Use os testes para conferir antes de transmitir.</p>
      <label for="wsUrl">Endereço WebSocket</label>
      <div class="row"><input id="wsUrl" value="ws://localhost:21213/" spellcheck="false"><button class="primary" id="connectBtn">Conectar</button></div>
      <div id="connectionWarning"></div>
      <label>Eventos de teste</label>
      <div id="testGrid">
        <button class="test" data-test="like">❤️ Like</button><button class="test" data-test="chat">💬 Chat</button><button class="test" data-test="follow">➕ Follow</button><button class="test" data-test="share">🍜 Share</button>
        <button class="test" data-test="gift1">🌹 1</button><button class="test" data-test="gift10">🔥 10</button><button class="test" data-test="gift300">⚡ 300</button><button class="test" data-test="gift1500">🦊 1500</button>
      </div>
      <label>Registro</label><div id="log"></div>
    </aside>
  </main>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=720,H=1280,TX=360,TY=920;

function boom(px,py,r,d,o,c){S.shake=.3;S.flash=.12;S.fc=c||'#ffb040';if(!c)fx({k:'t',x:px,y:py,s:'🔥',l:.6,z:r*1.3});fx({k:'r',x:px,y:py,m:r,l:.45,c});for(const e of S.en)if(Math.hypot(e.x-px,e.y-py)<r+e.r)hit(e,d,o)}

function ev(type,n,d=1){if(S.over)return;if(type==='like')for(let i=0;i<Math.min(d,15);i++)S.q.push(n);else if(type==='chat'){soldier(n,12);pts(n,1)}else if(type==='follow'){S.shield=10;banner(n+' seguiu! Barreira de chakra',2,'結界')}else if(type==='share'){S.hp=Math.min(100,S.hp+10);fx({k:'t',x:TX,y:TY-80,s:'🍜',l:.8,z:70})}else if(type==='gift')gift(n,d);if(S.q.length>200)S.q.length=200}
function up(dt){const s=S;s.shake=Math.max(0,s.shake-dt);s.flash=Math.max(0,s.flash-dt);if(s.over){s.over-=dt;if(s.over<=0)reset();return}s.wave=1+(s.kills/25|0);if(s.wave%5===0&&s.bossW!==s.wave){s.bossW=s.wave;const h=40+s.wave*4;s.en.push({x:TX,y:-80,hp:h,mhp:h,sp:35,r:70,e:'🐍',boss:1});banner('COBRA GIGANTE INVOCADA!',2,'口寄せ')}s.sp-=dt;if(s.sp<=0){s.sp=Math.max(.3,1.1-s.wave*.07);const r=Math.random();let px=R(30,690),py=-30;if(r>.7){px=r<.85?-30:750;py=R(0,500)}const big=Math.random()<.18;s.en.push({x:px,y:py,hp:big?4:1,mhp:big?4:1,sp:R(55,85)+s.wave*5,r:big?42:28,e:big?'👹':'👺'})}s.auto-=dt;if(s.auto<=0){s.auto=.9;shoot(TX,TY-60,null)}s.qt-=dt;if(s.qt<=0&&s.q.length){s.qt=.06;shoot(TX,TY-60,s.q.shift())}s.shield=Math.max(0,s.shield-dt);for(const o of s.so){o.a+=dt*.8;o.l-=dt;o.c-=dt;o.x=TX+Math.cos(o.a)*110;o.y=TY-10+Math.sin(o.a)*45;if(o.c<=0){o.c=.7;shoot(o.x,o.y,o.n)}}s.so=s.so.filter(o=>o.l>0);for(const b of s.bu){if(b.t&&!b.t.dead){const a=Math.atan2(b.t.y-b.y,b.t.x-b.x);b.vx=Math.cos(a)*900;b.vy=Math.sin(a)*900}b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;for(const e of s.en)if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+8){hit(e,b.dmg,b.o);b.l=0;break}}s.bu=s.bu.filter(b=>b.l>0);if(s.laser>=0){s.laser+=dt/2.6;const ly=s.laser*H;for(const e of s.en)if(Math.abs(e.y-ly)<70)hit(e,999,s.lo);if(s.laser>1)s.laser=-1}for(const e of s.en){if(e.dead)continue;e.f=Math.max(0,(e.f||0)-dt);const dx=TX-e.x,dy=TY-e.y,d=Math.hypot(dx,dy);e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;if(d<70){e.dead=1;fx({k:'r',x:e.x,y:e.y,m:90,l:.3});if(!s.shield){s.hp-=e.boss?25:6;if(s.hp<=0){s.hp=0;s.over=7;let m=0;for(const k in board)if(board[k]>m){m=board[k];s.mvp=k}}}}}s.en=s.en.filter(e=>!e.dead);for(const f of s.fx)f.l-=dt;s.fx=s.fx.filter(f=>f.l>0);if(s.ban){s.ban.l-=dt;if(s.ban.l<=0)s.ban=null}}
const E=(s,px,py,z)=>{x.font=z+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(s,px,py)};
function T(s,px,py,z,c,al='center'){x.font=z+'px '+F;x.textAlign=al;x.textBaseline='middle';x.lineWidth=6;x.strokeStyle='#0a0414';x.strokeText(s,px,py);x.fillStyle=c;x.fillText(s,px,py)}

const hh=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
function ninja(px,py,z,o){x.save();x.translate(px,py);x.scale(z,z);x.fillStyle=o.dark;x.fillRect(-12,36,10,14);x.fillRect(2,36,10,14);x.fillStyle=o.suit;x.fillRect(-16,6,32,32);x.fillRect(-23,8,8,22);x.fillRect(15,8,8,22);x.fillStyle=o.dark;x.fillRect(-16,28,32,6);x.fillStyle='#ffd9b8';x.fillRect(-23,30,8,6);x.fillRect(15,30,8,6);x.beginPath();x.arc(0,-10,17,0,7);x.fill();x.fillStyle=o.hair;x.beginPath();for(let i=0;i<9;i++){const a=Math.PI+i*Math.PI/8,r=i%2?20:31;x.lineTo(Math.cos(a)*r,-10+Math.sin(a)*r)}x.lineTo(0,-10);x.fill();x.fillStyle=o.mask?'#111':'#233a8a';x.fillRect(-18,-17,36,7);x.fillStyle='#c9d3de';x.fillRect(-9,-17,18,7);x.fillStyle='#fff';x.fillRect(-11,-7,8,9);x.fillRect(3,-7,8,9);x.fillStyle=o.eye;x.fillRect(-8,-6,5,8);x.fillRect(5,-6,5,8);if(o.mask)x.fillStyle='#222',x.fillRect(-17,0,34,9);else if(o.wh){x.strokeStyle='#7a4a2a';x.lineWidth=1.5;for(let i=-1;i<2;i++){x.beginPath();x.moveTo(-17,-1+i*3);x.lineTo(-10,i*3);x.moveTo(17,-1+i*3);x.lineTo(10,i*3);x.stroke()}x.fillStyle='#a33';x.fillRect(-4,3,8,2)}x.restore()}
function sph(px,py,r){const g=x.createRadialGradient(px,py,0,px,py,r*1.6);g.addColorStop(0,'#fff');g.addColorStop(.35,'#6fd3ff');g.addColorStop(1,'rgba(40,120,255,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r*1.6,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=4;const q=Date.now()/90;for(let i=0;i<3;i++){x.beginPath();x.arc(px,py,r*(.4+i*.22),q+i*2,q+i*2+2.2);x.stroke()}}
